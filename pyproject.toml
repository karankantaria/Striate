[build-system]
# 77+ for PEP 639: the SPDX `license` string and `license-files` below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "binviz"
description = "Binary visualiser & triage tool: linked interactive views over a shared address-space model"
requires-python = ">=3.11"
# Without this the PyPI page is the metadata table and nothing else — the
# summary line, then blank where the description should be. It is the first
# thing anyone deciding whether to `pip install` a binary-analysis tool
# reads, so it is the README rather than a shorter blurb written twice.
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

# Trove classifiers are the only structured facts PyPI can filter on, so
# they are the difference between being found by someone searching for a
# reverse-engineering tool and being found by someone who already knows the
# name. "Static analysis only" is not expressible here; the README says it.
#
# No `License ::` classifier: PEP 639 superseded it with the SPDX `license`
# expression above, and setuptools >= 77 *fails the build* if both are
# present rather than warning. Adding it back breaks packaging.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: System :: Monitoring",
]
keywords = [
    "binary", "visualisation", "reverse-engineering", "entropy",
    "disassembly", "triage", "malware-analysis", "hilbert", "elf", "pe",
    "mach-o", "control-flow-graph",
]
# One source of truth, in src/binviz/__init__.py. It used to be declared
# here *and* there, and the two had already drifted apart (0.0.1 vs 0.0.3).
dynamic = ["version"]

# Ranges, not pins (§4.2). Exact pins are right for a lockfile and wrong for
# a published distribution: `numpy==2.5.1` beside anything else that wants
# numpy produces an unsolvable resolution, and the user cannot fix it. The
# versions actually tested live in `constraints-dev.txt`; install with
#     pip install -e ".[dev]" -c constraints-dev.txt
# to reproduce the environment the suite is green in.
#
# Upper bounds are at the next major because binviz is an application rather
# than a library — nothing depends on *us*, so a cap here strands nobody, and
# a silent API break in a binary parser is a wrong answer rather than a
# crash.
dependencies = [
    # The tight one, on purpose. lief's API moves fast and it is the
    # component whose failure mode is a *plausible but wrong* parse rather
    # than an exception. Nothing else in a normal environment depends on
    # lief, so a narrow range costs almost no resolution pain. Re-run the
    # parser tests before widening this.
    "lief>=1.0,<1.1",
    # 5.0.2, not 5.0.1, and not 5.0: 5.0.0 is yanked on PyPI ("wrong"), and
    # a floor that resolves to a yanked release is a floor nobody should
    # land on. 5.0.1 was the floor until the `floors` job first ran and
    # failed it on two counts: RIP-relative `lea` yields no pointer
    # immediate (`ptr_imms == ()`), which costs function discovery its
    # pointer seeds and makes `skipdata` fail to resync; and it imports
    # `pkg_resources` at import time, which setuptools >= 81 no longer
    # ships, so it does not import at all in a current environment.
    # 5.0.2 is the lowest version where decode starts, ptr_imms and
    # skipdata are all correct — measured, not assumed.
    "capstone>=5.0.2,<6",
    "numpy>=2.1,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pillow>=10.1,<14",
]

[project.optional-dependencies]
# `binviz app`, the native desktop window (ARCHITECTURE.md §2). An extra rather
# than a runtime dependency so the base install stays lean — pywebview pulls
# a GUI toolkit binding on Linux, and most installs only ever want the
# server. Without it `binviz app` opens the default browser instead.
app = ["pywebview>=5.0,<7"]
dev = [
    "pytest>=8,<10",
    # FastAPI's TestClient transport (tests/test_service.py)
    "httpx>=0.27,<1",
    # independent x86 decoder used as the differential-test oracle where
    # binutils (objdump) is unavailable, e.g. plain Windows hosts
    "iced-x86>=1.21,<2",
    # zig cc is the cross-compiler used to build the ELF corpus samples on
    # hosts without a native Linux toolchain (the samples are parsed, never run)
    "ziglang>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/karankantaria/binviz"
Source = "https://github.com/karankantaria/binviz"
Issues = "https://github.com/karankantaria/binviz/issues"
Security = "https://github.com/karankantaria/binviz/blob/main/SECURITY.md"

[project.scripts]
binviz = "binviz.cli:main"

[tool.setuptools.dynamic]
version = { attr = "binviz.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Generated data staged into the package by tools/build_ui.py, all of it
# canonical somewhere else in the repo. Without the first two entries the
# wheel contains a backend and no UI at all (§4.1); without the last it
# contains an analyser running on hardcoded thresholds instead of the
# measured ones (plan §5.3), which is quieter and worse.
[tool.setuptools.package-data]
binviz = ["webui/*", "webui/assets/*", "icons/*", "calibration.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not perf'"
markers = [
    "oracle: differential tests requiring radare2 (deselect with '-m \"not oracle\"')",
    "perf: performance-target tests on 100 MB inputs (run with '-m perf')",
]
