<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>binviz</title>
    <link rel="stylesheet" href="/src/theme.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <span class="brand">binviz</span>
        <input id="path-input" type="text" spellcheck="false" list="recent-files"
               placeholder="absolute path to a binary… (or drop a file anywhere)" />
        <datalist id="recent-files"></datalist>
        <button id="open-btn">Open</button>
        <button id="nav-prev" title="previous file in directory ( [ )" disabled>‹</button>
        <button id="nav-next" title="next file in directory ( ] )" disabled>›</button>
        <span id="nav-pos" class="range-label muted" hidden></span>
        <span id="status-chip" class="chip" hidden></span>
        <span class="spacer"></span>
        <span id="file-label" class="file-label"></span>
        <button id="theme-btn" title="toggle light/dark">◐</button>
      </header>

      <main id="layout" hidden>
        <section id="overall-pane" class="pane">
          <div class="pane-head">
            <h2>Overall</h2>
            <select id="overall-layout">
              <option value="linear">Linear</option>
              <option value="hilbert">Hilbert</option>
            </select>
            <select id="overall-mode">
              <option value="byteclass">Byte class</option>
              <option value="signal">Entropy</option>
              <option value="value">Byte value</option>
            </select>
            <span id="overall-legend" class="legend"></span>
          </div>
          <div id="overall-canvas" class="canvas-host"></div>
        </section>

        <section id="zoom-pane" class="pane">
          <div class="pane-head">
            <h2>Zoomed</h2>
            <span id="zoom-range" class="range-label muted">no selection</span>
            <button id="zoom-clear" title="clear selection">✕</button>
          </div>
          <div id="zoom-canvas" class="canvas-host"></div>
        </section>

        <section id="plot-pane" class="pane">
          <div class="pane-head">
            <h2>Signals</h2>
            <span id="plot-signals" class="signal-picks"></span>
            <label class="toggle"><input type="checkbox" id="plot-follow" />follow selection</label>
          </div>
          <div id="plot-canvas" class="canvas-host"></div>
        </section>

        <aside id="side-pane" class="pane">
          <div class="pane-head"><h2 id="info-title">Binary</h2></div>
          <div class="scroll">
            <div id="triage-info"></div>
            <div id="model-info"></div>
          </div>
        </aside>

        <section id="hex-pane" class="pane">
          <div class="pane-head">
            <h2>Hex</h2>
            <span id="hex-addr" class="range-label muted"></span>
          </div>
          <div id="hex-scroll" class="scroll hexscroll"></div>
        </section>

        <section id="hist2d-pane" class="pane">
          <div class="pane-head">
            <h2>Bigram</h2>
            <select id="hist2d-display" title="display transform">
              <option value="log1p">log1p</option>
              <option value="rank">rank</option>
              <option value="sqrt">sqrt</option>
              <option value="linear">linear</option>
            </select>
            <select id="dtype-select" title="element dtype (shared)">
              <option value="u8">u8</option>
              <option value="u12">u12</option>
              <option value="u16le">u16le</option>
              <option value="u16be">u16be</option>
              <option value="u32le">u32le</option>
              <option value="u32be">u32be</option>
              <option value="u64le">u64le</option>
              <option value="u64be">u64be</option>
              <option value="f32le">f32le</option>
              <option value="f32be">f32be</option>
              <option value="f64le">f64le</option>
              <option value="f64be">f64be</option>
            </select>
            <span id="hist2d-status" class="range-label muted"></span>
            <button id="locate-clear" title="clear brush highlight">✕</button>
          </div>
          <div id="hist2d-canvas" class="canvas-host"></div>
        </section>

        <section id="hist3d-pane" class="pane">
          <div class="pane-head">
            <h2>Trigram</h2>
            <label class="toggle" title="minimum cell count">thr
              <input type="number" id="hist3d-threshold" min="1" step="1" value="1" />
            </label>
            <label class="toggle" title="point size">size
              <input type="range" id="hist3d-scale" min="0.5" max="6" step="0.5" value="2" />
            </label>
            <label class="toggle" title="additive blending reveals interior density">
              <input type="checkbox" id="hist3d-overlap" checked />overlap</label>
            <label class="toggle"><input type="checkbox" id="hist3d-spin" checked />spin</label>
            <span id="hist3d-status" class="range-label muted"></span>
          </div>
          <div id="hist3d-canvas" class="canvas-host"></div>
        </section>

        <section id="image-pane" class="pane">
          <div class="pane-head">
            <h2>Image</h2>
            <select id="img-mode" title="pixel format"></select>
            <label class="toggle" title="row stride in pixels">w
              <input type="number" id="img-width" min="1" step="1" value="256" />
            </label>
            <span id="img-suggest" class="suggest"
                  title="suggested row strides (autocorrelation)"></span>
            <label class="toggle" title="start offset (hex ok)">@
              <input type="text" id="img-offset" value="0x0" class="offset-input" />
            </label>
            <button id="img-fitsel" title="set width from selection length">sel→w</button>
            <label class="toggle"><input type="checkbox" id="img-invert" />invert</label>
            <span id="img-status" class="range-label muted"></span>
          </div>
          <div id="image-canvas" class="canvas-host"></div>
        </section>

        <section id="dotplot-pane" class="pane">
          <div class="pane-head">
            <h2>Dot plot</h2>
            <select id="dot-ax1" title="x-axis range">
              <option value="selection">x: selection</option>
              <option value="file">x: file</option>
            </select>
            <select id="dot-ax2" title="y-axis range">
              <option value="selection">y: selection</option>
              <option value="file">y: file</option>
            </select>
            <label class="toggle" title="match window (bytes)">k
              <input type="number" id="dot-window" min="1" max="64" step="1" value="8" />
            </label>
            <label class="toggle" title="positions sampled per pass">n
              <input type="number" id="dot-samples" min="1000" step="100000" value="500000" />
            </label>
            <label class="toggle" title="keep sampling until every position is resolved">
              <input type="checkbox" id="dot-run" checked />refine</label>
            <span id="dot-status" class="range-label muted"></span>
          </div>
          <div id="dotplot-canvas" class="canvas-host"></div>
        </section>

        <section id="cfg-pane" class="pane">
          <div class="pane-head">
            <h2>CFG</h2>
            <input id="cfg-search" type="text" spellcheck="false"
                   placeholder="filter…" class="offset-input" />
            <label class="toggle" title="show only functions overlapping the selection">
              <input type="checkbox" id="cfg-filter-sel" />selection only</label>
            <button id="cfg-fit" title="fit graph to view">fit</button>
            <span id="cfg-status" class="range-label muted"></span>
          </div>
          <div id="cfg-banner" class="cfg-banner" hidden></div>
          <div id="cfg-body">
            <div id="cfg-list" class="scroll"></div>
            <div id="cfg-canvas" class="canvas-host"></div>
          </div>
        </section>
      </main>

      <div id="empty-state">
        <p>Open a binary to begin — paste an absolute path above, or drop a file onto the window.</p>
      </div>
      <div id="tooltip" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
